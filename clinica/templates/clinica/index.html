<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema da Clínica</title>
</head>
<body>
    <h1>Bem-vindo ao Sistema da Clínica</h1>
    <hr> <h2>Nossos Pacientes Cadastrados:</h2>

    <ul>
        {% for paciente in lista_pacientes %}
            <li>
                <strong>{{ paciente.nome_paciente }}</strong> <br>
                CPF: {{ paciente.cpf }} | Convênio: {{ paciente.convenio }}
            </li>
            <br>
        {% empty %}
            <li>Nenhum paciente cadastrado no momento.</li>
        {% endfor %}
    </ul>

</body>
</html>
