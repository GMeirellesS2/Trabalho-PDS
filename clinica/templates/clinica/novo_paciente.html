{% extends 'clinica/base.html' %}

{% block title %}Novo Paciente{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="card shadow border-0" style="max-width: 800px; margin: 0 auto;">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">➕ Cadastrar Novo Paciente</h4>
        </div>
        <div class="card-body p-4">
            
            {% if erro %}
            <div class="alert alert-danger" role="alert">
                {{ erro }}
            </div>
            {% endif %}

            <form method="POST" action="{% url 'novo_paciente' %}">
                {% csrf_token %} <div class="row g-3">
                    <div class="col-md-4">
                        <label for="cpf" class="form-label fw-bold">CPF *</label>
                        <input type="text" name="cpf" id="cpf" class="form-control" required maxlength="14" placeholder="Apenas números">
                    </div>
                    
                    <div class="col-md-8">
                        <label for="nome_paciente" class="form-label fw-bold">Nome Completo *</label>
                        <input type="text" name="nome_paciente" id="nome_paciente" class="form-control" required placeholder="Digite o nome do paciente">
                    </div>

                    <div class="col-md-4">
                        <label for="data_nasc" class="form-label fw-bold">Data de Nascimento</label>
                        <input type="date" name="data_nasc" id="data_nasc" class="form-control">
                    </div>

                    <div class="col-md-4">
                        <label for="email" class="form-label fw-bold">E-mail</label>
                        <input type="email" name="email" id="email" class="form-control" placeholder="paciente@email.com">
                    </div>

                    <div class="col-md-4">
                        <label for="convenio" class="form-label fw-bold">Convênio</label>
                        <select name="convenio" id="convenio" class="form-select">
                            <option value="">Selecione...</option>
                            <option value="Particular">Particular</option>
                            <option value="Unimed">Unimed</option>
                            <option value="Bradesco Saúde">Bradesco Saúde</option>
                            <option value="Amil">Amil</option>
                            <option value="SulAmérica">SulAmérica</option>
                            <option value="SUS">SUS</option>
                        </select>
                    </div>
                </div>

                <hr class="my-4">
                
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'buscar_paciente' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Salvar Paciente</button>
                </div>
            </form>
            
        </div>
    </div>
</div>
{% endblock %}
