{% extends 'clinica/base.html' %} 
{% block title %}Dashboard - Minha Clínica{% endblock %}

{% block content %}
<div class="container-fluid py-3">
    
    <h2 class="mb-4 text-secondary">Dashboard</h2>

    <div class="row g-4 mb-4">
        
        <div class="col-md-4">
            <div class="card h-100 border-0 shadow-sm rounded-4" style="background-color: #e3f2fd;">
                <div class="card-body d-flex flex-column align-items-center justify-content-center p-4">
                    <h5 class="text-muted text-uppercase fw-bold mb-2">Pacientes</h5>
                    <h1 class="display-4 fw-bold text-primary mb-0">{{ total_pacientes }}</h1>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100 border-0 shadow-sm rounded-4" style="background-color: #e8f5e9;">
                <div class="card-body d-flex flex-column align-items-center justify-content-center p-4">
                    <h5 class="text-muted text-uppercase fw-bold mb-2">Médicos</h5>
                    <h1 class="display-4 fw-bold text-success mb-0">{{ total_medicos }}</h1>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100 border-0 shadow-sm rounded-4" style="background-color: #fff3e0;">
                <div class="card-body d-flex flex-column align-items-center justify-content-center p-4">
                    <h5 class="text-muted text-uppercase fw-bold mb-2">Consultas</h5>
                    <h1 class="display-4 fw-bold text-warning mb-0">{{ total_consultas }}</h1>
                </div>
            </div>
        </div>

    </div>

</div>
{% endblock %}
