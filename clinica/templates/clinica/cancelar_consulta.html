{% extends 'clinica/base.html' %}

{% block title %}Cancelar Consulta{% endblock %}

{% block content %}

<div class="container-fluid">
    <div class="card shadow border-0" style="max-width: 700px; margin: 0 auto;">

        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">❌ Cancelar Consulta</h4>
        </div>

        <div class="card-body p-4">
            
            {% if erro %}
            <div class="alert alert-danger">
                {{ erro }}
            </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <!-- ID CONSULTA -->

                <div class="mb-3">
                    <label class="form-label fw-bold">ID da Consulta *</label>
                    <input type="number"
                           name="id_consulta"
                           class="form-control"
                           required>
                </div>

                <div class="mb-4">
                    <button type="submit" class="btn btn-primary">
                        Buscar Consulta
                    </button>
                </div>

                {% if consulta %}

                <hr>

                <!-- PACIENTE -->

                <div class="mb-3">
                    <label class="form-label fw-bold">Paciente</label>
                    <input type="text"
                           class="form-control"
                           value="{{ consulta.cpf_paciente.nome_paciente }}"
                           readonly>
                </div>

                <!-- MEDICO -->

                <div class="mb-3">
                    <label class="form-label fw-bold">Médico Responsável</label>
                    <input type="text"
                           class="form-control"
                           value="Dr(a). {{ consulta.crm_medico.usuario_medico.first_name }}"
                           readonly>
                </div>

                <!-- DATA -->

                <div class="mb-3">
                    <label class="form-label fw-bold">Data da Consulta</label>
                    <input type="text"
                           class="form-control"
                           value="{{ consulta.data_hora }}"
                           readonly>
                </div>

                <hr>

                <div class="d-flex justify-content-end gap-2">

                    <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                        Voltar
                    </a>

                    <button type="submit"
                            name="confirmar_cancelamento"
                            value="1"
                            class="btn btn-danger">

                        Confirmar Cancelamento

                    </button>

                </div>

                {% endif %}

            </form>

        </div>
    </div>
</div>

{% endblock %}
